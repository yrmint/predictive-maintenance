[project]
name = "predictive-maintenance"
version = "0.1.0"
description = ""
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "sensor",
]

[dependency-groups]
dev = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "ruff>=0.12.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
